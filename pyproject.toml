[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop"
version = "0.1.0"
description = "Romanian Windows desktop assistant and tutor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials==6.11.2"]

[project.optional-dependencies]
# Imports required by Ion's read-only workingVersion1.py. Its PyQt6 cursor is not loaded.
voice = ["sounddevice>=0.5,<0.6", "faster-whisper>=1.2,<2", "google-genai>=1,<2", "mss>=10,<11", "numpy>=2,<3"]
openrouter = ["PyQt6>=6.6,<7", "edge-tts>=7,<8", "sounddevice>=0.5,<0.6", "faster-whisper>=1.2,<2", "numpy>=2,<3"]

[project.gui-scripts]
jarvis = "jarvis.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jarvis*"]
